<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar - BiteMatch</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
     <link rel="stylesheet" href="estilos.css">
     <link rel="icon" type="image/png" href="Logo-removebg-preview.png">
</head>
<body>
 <header class="main-header">
    <div class="logo-container">
        <img src="Logo-removebg-preview.png" alt="Logo de BiteMatch">
    </div>

    <!-- Botón de 3 puntos para celular -->
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>

    <!-- Menú de navegación -->
    <nav class="nav-menu" id="navMenu">
        <a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a>
        <a href="2descubre.html"><i class="fa-solid fa-fire"></i> Match</a>
        <a href="favoritos.html"><i class="fa-solid fa-heart"></i> Favoritos</a>
        <a href="explorar.html"><i class="fa-solid fa-compass"></i> Explorar</a> 
        <a href="miperfil.html"><i class="fa-solid fa-user"></i> Mi Perfil</a>
        <a href="carrito.html"><i class="fa-solid fa-cart-shopping"></i> Carrito </a>
    </nav>
</header>
<main class="content-container">
        
        <section id="explorar" class="explorar-section">
            
            <div class="explorar-header">
                <h2>¿De qué tienes antojo hoy?</h2>
                <p>Usa los filtros y haz una búsqueda rápida para afinar tu puntería</p>
            </div>

            <div class="buscador-contenedor">
                <span class="lupa-icono">🔍</span>
                <input type="text" placeholder="Busca tacos, hamburguesas, sushi, postres..." class="input-busqueda">
                <button class="btn-buscar">Buscar</button>
            </div>

            <div class="filtros-avanzados">
                

                <div class="filtro-grupo">
                    <label for="filtro-calificacion">⭐ Calificación:</label>
                    <select id="filtro-calificacion" class="select-filtro">
                        <option value="todas">Cualquiera</option>
                        <option value="4">4.0+ Excelente</option>
                        <option value="4.5">4.5+ Lo mejor</option>
                    </select>
                </div>

            </div>

            <div class="burbujas-contenedor">
                <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🍔</span>
                    <span class="burbuja-texto">Hamburguesas</span>
                </button>
                
                <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🍕</span>
                    <span class="burbuja-texto">Pizzas</span>
                </button>
                 <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🌮</span>
                    <span class="burbuja-texto">Comida Mexicana</span>
                </button>      
                <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🍩</span>
                    <span class="burbuja-texto">Postres</span>
                </button>
                <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🍗</span>
                    <span class="burbuja-texto">Pollo</span>
                </button>
                 <button class="burbuja-antojo">
                    <span class="burbuja-emoji">☕</span>
                    <span class="burbuja-texto">Bebidas</span>
                </button>
            </div>
<div id="resultados-restaurantes" class="resultados-contenedor" style="margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                </div>
        </section>
    </main>

    <footer class="main-footer">
        <p class="slogan">BiteMatch: Desliza. Antójate. Devora.</p>
        <p class="copyright">&copy; CEFRAM 2026. TDS "B"</p>
    </footer>
<script>
    const restaurantes = [
        { nombre: "La Choza de la Pizza", categoria: "Pizzas",  calificacion: 4.2, imagen: "🍕" },
        { nombre: "Chef Johnny's", categoria: "Pizzas",  calificacion: 4.2, imagen: "🍕" },
        { nombre: "La Tradicional", categoria: "Pizzas",   calificacion: 4.2, imagen: "🍕" },
        { nombre: "Little Italy Pizza", categoria: "Pizzas",   calificacion: 4.2, imagen: "🍕" },
        { nombre: "Pixel Pizza", categoria: "Pizzas",  calificacion: 4.2, imagen: "🍕" },
        { nombre: "Imperial Burger", categoria: "Hamburguesas",   calificacion: 4.3, imagen: "🍔" },
        { nombre: "Donald’s Diner", categoria: "Hamburguesas",   calificacion: 4.4, imagen: "🍔" },
        { nombre: "Winnie’s", categoria: "Hamburguesas",  calificacion: 4.3, imagen: "🍔" },
        { nombre: "Crazy Dogs", categoria: "Hamburguesas",   calificacion: 4.3, imagen: "🍔" },
        { nombre: "Donut Master", categoria: "Postres",   calificacion: 4.1, imagen: "🍩" },
        { nombre: "La Artesanal", categoria: "Postres",   calificacion: 4.3, imagen: "🍩" },
        { nombre: "El Portal", categoria: "Postres",  calificacion: 4.1, imagen: "🍩" },
        { nombre: "Frosty Bar", categoria: "Postres",   calificacion: 4.2, imagen: "🍩" },
        { nombre: "Helados Rosita", categoria: "Postres",   calificacion: 4.8, imagen: "🍩" },
        { nombre: "Chicago", categoria: "Postres",  calificacion: 4.3, imagen: "🍩" },
        { nombre: "Pasteleria Bon Bon", categoria: "Postres",   calificacion: 3.9, imagen: "🍩" },
        { nombre: "Barrio Jalisco", categoria: "Comida Mexicana",  calificacion: 1.0, imagen: "🌮" },
        { nombre: "Taquería Cielito Lindo", categoria: "Comida Mexicana",   calificacion: 4.4, imagen: "🌮" },
        { nombre: "El Burro Loco", categoria: "Comida Mexicana",   calificacion: 3.5, imagen: "🌮" },
        { nombre: "Tacos Municipales", categoria: "Comida Mexicana",  calificacion: 4.3, imagen: "🌮" },
        { nombre: "Chichi's Tacos", categoria: "Comida Mexicana",  calificacion: 4.0, imagen: "🌮" },
        { nombre: "El Macizo", categoria: "Comida Mexicana",   calificacion: 4.4, imagen: "🌮" },
        { nombre: "Los Chilitos", categoria: "Comida Mexicana", calificacion: 4.5, imagen: "🌮" },
        { nombre: "Pollo del Campo", categoria:"Pollo", calificacion: 4.3, imagen: "🍗"},
        { nombre: "La Granja", categoria: "Pollo", calificacion: 4.3, imagen: "🍗" },
        { nombre: "Tennessee Crispy", categoria: "Pollo",  calificacion: 4.2, imagen: "🍗" },
        { nombre: "Pollo Chiquito", categoria: "Pollo",   calificacion: 2.9, imagen: "🍗" },
        { nombre: "Tío Pollo", categoria: "Pollo",  calificacion: 3.8, imagen: "🍗" },
        { nombre: "Pollo Supremo", categoria: "Pollo",  calificacion: 4.3, imagen: "🍗" },
        { nombre: "Campo y Brasa", categoria: "Pollo",  calificacion: 4.4, imagen: "🍗" },
        { nombre: "Boba Boom", categoria: "Bebidas",  calificacion: 4.0, imagen: "☕" },
        { nombre: "Moonlight Coffee", categoria: "Bebidas",  calificacion: 4.3, imagen: "☕" },
        { nombre: "Coffee Station", categoria: "Bebidas",  calificacion: 4.5, imagen: "☕" },
        { nombre: "Espresso Vita", categoria: "Bebidas",  calificacion: 5.0, imagen: "☕" },
    ];

    const inputBusqueda = document.querySelector('.input-busqueda');
    const btnBuscar = document.querySelector('.btn-buscar');
    const filtroCalificacion = document.getElementById('filtro-calificacion');
    const contenedorResultados = document.getElementById('resultados-restaurantes');
    const botonesBurbujas = document.querySelectorAll('.burbuja-antojo');

    let categoriaSeleccionada = "todas";

    function mostrarRestaurantes(lista) {
        contenedorResultados.innerHTML = ""; // Limpiar resultados anteriores

        if (lista.length === 0) {
            contenedorResultados.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888;">No se encontraron antojos que coincidan con los filtros. 😢</p>`;
            return;
        }

        lista.forEach(restaurante => {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta-restaurante';
            tarjeta.style = "background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; border: 1px solid #eee;";
            
            tarjeta.innerHTML = `
                <div style="font-size: 40px; margin-bottom: 10px;">${restaurante.imagen}</div>
                <h4 style="margin: 5px 0; color: #333;">${restaurante.nombre}</h4>
                <p style="margin: 2px 0; font-size: 14px; color: #666;">Categoría: ${restaurante.categoria}</p>
                <p style="margin: 2px 0; font-size: 13px; color: #ff9800;">⭐ ${restaurante.calificacion} 
            `;
            contenedorResultados.appendChild(tarjeta);
        });
    }

    function filtrarProyectos() {
        const textoBusqueda = inputBusqueda.value.toLowerCase().trim();
        const calificacionMin = filtroCalificacion.value;

        const resultadoFiltrado = restaurantes.filter(restaurante => {
            // Filtro por texto (Nombre o categoría)
            const coincideTexto = restaurante.nombre.toLowerCase().includes(textoBusqueda) || 
                                  restaurante.categoria.toLowerCase().includes(textoBusqueda);
            
            // Filtro por Burbujas de categorías
            const coincideCategoria = (categoriaSeleccionada === "todas" || restaurante.categoria === categoriaSeleccionada);

            // Filtro por Estrellas
            let coincideCalificacion = true;
            if (calificacionMin !== "todas") {
                coincideCalificacion = restaurante.calificacion >= parseFloat(calificacionMin);
            }

            return coincideTexto && coincideCategoria && coincideCalificacion ;
        });

        mostrarRestaurantes(resultadoFiltrado);
    }

    btnBuscar.addEventListener('click', filtrarProyectos);
    inputBusqueda.addEventListener('keyup', (e) => { if (e.key === 'Enter') filtrarProyectos(); });
    filtroCalificacion.addEventListener('change', filtrarProyectos);
    
    // Control de las Burbujas (Toggle de selección)
    botonesBurbujas.forEach(boton => {
        boton.addEventListener('click', () => {
            const textoBoton = boton.querySelector('.burbuja-texto').innerText;

            // Si ya estaba seleccionada, la deseleccionamos
            if (boton.classList.contains('seleccionada')) {
                boton.classList.remove('seleccionada');
                categoriaSeleccionada = "todas";
            } else {
                // Quitamos la clase a las demás burbujas y se la ponemos a esta
                botonesBurbujas.forEach(b => b.classList.remove('seleccionada'));
                boton.classList.add('seleccionada');
                categoriaSeleccionada = textoBoton;
            }
            filtrarProyectos();
        });
    });

    // Cargar todos los restaurantes al iniciar la página por primera vez
    mostrarRestaurantes(restaurantes);
</script>
<script>
    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');

    if (menuToggle && navMenu) {
        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });

        // Cerrar el menú si el usuario hace clic fuera de él
        document.addEventListener('click', (e) => {
            if (!menuToggle.contains(e.target) && !navMenu.contains(e.target)) {
                navMenu.classList.remove('active');
            }
        });
    }
</script>
</body>
</html>
