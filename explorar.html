<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteMatch</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="2descubre.html">Descubrir</a>
            <a href="explorar.html">Explorar</a>
            <a href="miperfil.html">Mi Perfil</a>
        </nav>
        <div class="logo-container">
            <img src="Logo-removebg-preview.png" alt="Logo de BiteMatch">
        </div>
    </header>

<main class="content-container">
        
        <section id="explorar" class="explorar-section">
            
            <div class="explorar-header">
                <h2>¿De qué tienes antojo hoy?</h2>
                <p>Usa los filtros o haz una búsqueda rápida para afinar tu puntería</p>
            </div>

            <div class="buscador-contenedor">
                <span class="lupa-icono">🔍</span>
                <input type="text" placeholder="Busca tacos, hamburguesas, sushi, postres..." class="input-busqueda">
                <button class="btn-buscar">Buscar</button>
            </div>

            <div class="filtros-avanzados">
                
                <div class="filtro-grupo">
                    <label for="filtro-precio">Presupuesto:</label>
                    <select id="filtro-precio" class="select-filtro">
                        <option value="todos">Cualquier precio</option>
                        <option value="economico">Económico ($)</option>
                        <option value="moderado">Moderado ($$)</option>
                        <option value="premium">Premium ($$$)</option>
                    </select>
                </div>

                <div class="filtro-grupo">
                    <label for="filtro-distancia">📍 Distancia máxima:</label>
                    <div class="slider-contenedor">
                        <input type="range" id="filtro-distancia" min="1" max="50" value="5" class="slider-filtro" oninput="document.getElementById('valor-distancia').innerText = this.value + ' km'">
                        <span id="valor-distancia">5 km</span>
                    </div>
                </div>

                <div class="filtro-grupo">
                    <label for="filtro-calificacion">⭐ Calificación:</label>
                    <select id="filtro-calificacion" class="select-filtro">
                        <option value="todas">Cualquiera</option>
                        <option value="4">4.0+ Excelente</option>
                        <option value="4.5">4.5+ Lo mejor</option>
                    </select>
                </div>

            </div>

            <div class="burbujas-contenedor">
                <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🍔</span>
                    <span class="burbuja-texto">Hamburguesas</span>
                </button>
                
                <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🍕</span>
                    <span class="burbuja-texto">Pizzas</span>
                </button>
                 <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🌮</span>
                    <span class="burbuja-texto">Comida Mexicana</span>
                </button>      
                <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🍩</span>
                    <span class="burbuja-texto">Postres</span>
                </button>
                <button class="burbuja-antojo">
                    <span class="burbuja-emoji">🍗</span>
                    <span class="burbuja-texto">Pollo</span>
                </button>
                 <button class="burbuja-antojo">
                    <span class="burbuja-emoji">☕</span>
                    <span class="burbuja-texto">Bebidas</span>
                </button>
            </div>
<div id="resultados-restaurantes" class="resultados-contenedor" style="margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                </div>
        </section>
    </main>

    <footer class="main-footer">
        <p class="slogan">BiteMatch: Desliza. Antójate. Devora.</p>
        <p class="copyright">&copy; CEFRAM 2026. TDS "B"</p>
    </footer>
<script>
    const restaurantes = [
        { nombre: "La Choza de la Pizza", categoria: "Pizzas", precio: "moderado", distancia: 1, calificacion: 4.2, imagen: "🍕" },
        { nombre: "Chef Johnny's", categoria: "Pizzas", precio: "premiun", distancia: 2, calificacion: 4.2, imagen: "🍕" },
        { nombre: "La Tradicional", categoria: "Pizzas", precio: "premiun", distancia: 3, calificacion: 4.2, imagen: "🍕" },
        { nombre: "Little Italy Pizza", categoria: "Pizzas", precio: "economico", distancia: 3, calificacion: 4.2, imagen: "🍕" },
        { nombre: "Pixel Pizza", categoria: "Pizzas", precio: "moderado", distancia: 3, calificacion: 4.2, imagen: "🍕" },
        { nombre: "Imperial Burger", categoria: "Hamburguesas", precio: "moderado", distancia: 2, calificacion: 4.3, imagen: "🍔" },
        { nombre: "Donald’s Diner", categoria: "Hamburguesas", precio: "moderado", distancia: 1, calificacion: 4.4, imagen: "🍔" },
        { nombre: "Winnie’s", categoria: "Hamburguesas", precio: "premiun", distancia: 2, calificacion: 4.3, imagen: "🍔" },
        { nombre: "Crazy Dogs", categoria: "Hamburguesas", precio: "moderado", distancia: 12, calificacion: 4.3, imagen: "🍔" },
        { nombre: "Donut Master", categoria: "Postres", precio: "moderado", distancia: 2, calificacion: 4.1, imagen: "🍩" },
        { nombre: "La Artesanal", categoria: "Postres", precio: "premiun", distancia: 2, calificacion: 4.3, imagen: "🍩" },
        { nombre: "El Portal", categoria: "Postres", precio: "economico", distancia: 1, calificacion: 4.1, imagen: "🍩" },
        { nombre: "Frosty Bar", categoria: "Postres", precio: "moderado", distancia: 1, calificacion: 4.2, imagen: "🍩" },
        { nombre: "Helados Rosita", categoria: "Postres", precio: "moderado", distancia: 2, calificacion: 4.8, imagen: "🍩" },
        { nombre: "Chicago", categoria: "Postres", precio: "premiun", distancia: 1, calificacion: 4.3, imagen: "🍩" },
        { nombre: "Pasteleria Bon Bon", categoria: "Postres", precio: "premiun", distancia: 4, calificacion: 3.9, imagen: "🍩" },
        { nombre: "Barrio Jalisco", categoria: "Comida Mexicana", precio: "economico", distancia: 5, calificacion: 1.0, imagen: "🌮" },
        { nombre: "Taquería Cielito Lindo", categoria: "Comida Mexicana", precio: "economico", distancia: 15, calificacion: 4.4, imagen: "🌮" },
        { nombre: "El Burro Loco", categoria: "Comida Mexicana", precio: "moderado", distancia: 4, calificacion: 3.5, imagen: "🌮" },
        { nombre: "Tacos Municipales", categoria: "Comida Mexicana", precio: "moderado", distancia: 6, calificacion: 4.3, imagen: "🌮" },
        { nombre: "Chichi's Tacos", categoria: "Comida Mexicana", precio: "moderado", distancia: 2, calificacion: 4.0, imagen: "🌮" },
        { nombre: "El Macizo", categoria: "Comida Mexicana", precio: "moderado", distancia: 2, calificacion: 4.4, imagen: "🌮" },
        { nombre: "Los Chilitos", categoria: "Comida Mexicana", precio: "moderado", distancia: 2, calificacion: 4.5, imagen: "🌮" },
        { nombre: "Pollo del Campo", categoria: "Pollo", precio: "economico", distancia: 1, calificacion: 4.3, imagen: "🍗" },
        { nombre: "La Granja", categoria: "Pollo", precio: "moderado", distancia: 1, calificacion: 4.3, imagen: "🍗" },
        { nombre: "Tennessee Crispy", categoria: "Pollo", precio: "moderado", distancia: 1, calificacion: 4.2, imagen: "🍗" },
        { nombre: "Pollo Chiquito", categoria: "Pollo", precio: "economico", distancia: 3, calificacion: 2.9, imagen: "🍗" },
        { nombre: "Tío Pollo", categoria: "Pollo", precio: "economico", distancia: 1, calificacion: 3.8, imagen: "🍗" },
        { nombre: "Pollo Supremo", categoria: "Pollo", precio: "premiun", distancia: 3, calificacion: 4.3, imagen: "🍗" },
        { nombre: "La Granja", categoria: "Pollo", precio: "moderado", distancia: 3, calificacion: 4.4, imagen: "🍗" },
        { nombre: "Boba Boom", categoria: "Bebidas", precio: "moderado", distancia: 4, calificacion: 4.0, imagen: "☕" },
        { nombre: "Moonlight Coffee", categoria: "Bebidas", precio: "premiun", distancia: 2, calificacion: 4.3, imagen: "☕" },
        { nombre: "Coffee Station", categoria: "Bebidas", precio: "moderado", distancia: 1, calificacion: 4.5, imagen: "☕" },
        { nombre: "Espresso Vita", categoria: "Bebidas", precio: "moderado", distancia: 3, calificacion: 5.0, imagen: "☕" },
    ];

    const inputBusqueda = document.querySelector('.input-busqueda');
    const btnBuscar = document.querySelector('.btn-buscar');
    const filtroPrecio = document.getElementById('filtro-precio');
    const filtroDistancia = document.getElementById('filtro-distancia');
    const filtroCalificacion = document.getElementById('filtro-calificacion');
    const contenedorResultados = document.getElementById('resultados-restaurantes');
    const botonesBurbujas = document.querySelectorAll('.burbuja-antojo');

    let categoriaSeleccionada = "todas";

    function mostrarRestaurantes(lista) {
        contenedorResultados.innerHTML = ""; // Limpiar resultados anteriores

        if (lista.length === 0) {
            contenedorResultados.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888;">No se encontraron antojos que coincidan con los filtros. 😢</p>`;
            return;
        }

        lista.forEach(restaurante => {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta-restaurante';
            tarjeta.style = "background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; border: 1px solid #eee;";
            
            tarjeta.innerHTML = `
                <div style="font-size: 40px; margin-bottom: 10px;">${restaurante.imagen}</div>
                <h4 style="margin: 5px 0; color: #333;">${restaurante.nombre}</h4>
                <p style="margin: 2px 0; font-size: 14px; color: #666;">Categoría: ${restaurante.categoria}</p>
                <p style="margin: 2px 0; font-size: 13px; color: #ff9800;">⭐ ${restaurante.calificacion} | 📍 ${restaurante.distancia} km</p>
                <p style="margin: 5px 0 0 0; font-weight: bold; font-size: 12px; color: #4caf50;">
                    ${restaurante.precio === 'economico' ? '$' : restaurante.precio === 'moderado' ? '$$' : '$$$'}
                </p>
            `;
            contenedorResultados.appendChild(tarjeta);
        });
    }

    function filtrarProyectos() {
        const textoBusqueda = inputBusqueda.value.toLowerCase().trim();
        const precioMax = filtroPrecio.value;
        const distanciaMax = parseInt(filtroDistancia.value);
        const calificacionMin = filtroCalificacion.value;

        const resultadoFiltrado = restaurantes.filter(restaurante => {
            // Filtro por texto (Nombre o categoría)
            const coincideTexto = restaurante.nombre.toLowerCase().includes(textoBusqueda) || 
                                  restaurante.categoria.toLowerCase().includes(textoBusqueda);
            
            // Filtro por Burbujas de categorías
            const coincideCategoria = (categoriaSeleccionada === "todas" || restaurante.categoria === categoriaSeleccionada);

            // Filtro por Presupuesto
            const coincidePrecio = (precioMax === "todos" || restaurante.precio === precioMax);

            // Filtro por Rango de Distancia
            const coincideDistancia = restaurante.distancia <= distanciaMax;

            // Filtro por Estrellas
            let coincideCalificacion = true;
            if (calificacionMin !== "todas") {
                coincideCalificacion = restaurante.calificacion >= parseFloat(calificacionMin);
            }

            return coincideTexto && coincideCategoria && coincidePrecio && coincideDistancia && coincideCalificacion;
        });

        mostrarRestaurantes(resultadoFiltrado);
    }

    btnBuscar.addEventListener('click', filtrarProyectos);
    inputBusqueda.addEventListener('keyup', (e) => { if (e.key === 'Enter') filtrarProyectos(); });
    filtroPrecio.addEventListener('change', filtrarProyectos);
    filtroCalificacion.addEventListener('change', filtrarProyectos);
    
    // El slider actualiza el número en vivo y filtra simultáneamente
    filtroDistancia.addEventListener('input', () => {
        document.getElementById('valor-distancia').innerText = filtroDistancia.value + ' km';
        filtrarProyectos();
    });

    // Control de las Burbujas (Toggle de selección)
    botonesBurbujas.forEach(boton => {
        boton.addEventListener('click', () => {
            const textoBoton = boton.querySelector('.burbuja-texto').innerText;

            // Si ya estaba seleccionada, la deseleccionamos
            if (boton.classList.contains('seleccionada')) {
                boton.classList.remove('seleccionada');
                categoriaSeleccionada = "todas";
            } else {
                // Quitamos la clase a las demás burbujas y se la ponemos a esta
                botonesBurbujas.forEach(b => b.classList.remove('seleccionada'));
                boton.classList.add('seleccionada');
                categoriaSeleccionada = textoBoton;
            }
            filtrarProyectos();
        });
    });

    // Cargar todos los restaurantes al iniciar la página por primera vez
    mostrarRestaurantes(restaurantes);
</script>
</body>
</html>
