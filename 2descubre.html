        const cardDetalle = document.getElementById('cardDetalle');
        const indicadoresFotos = document.getElementById('indicadoresFotos');
        const btnLike = document.getElementById('btnLike');
        const btnDislike = document.getElementById('btnDislike');
        const btnSuperlike = document.getElementById('btnSuperlike');
        const matchPopup = document.getElementById('matchPopup');
        const btnCerrarMatch = document.getElementById('btnCerrarMatch');

        function cargarLocal() {
            if (currentIndex >= localesComida.length) {
                currentIndex = 0; 
            }
            const local = localesComida[currentIndex];
            cardNombre.textContent = local.nombre;
            cardDetalle.textContent = local.detalle;
            currentPhotoIndex = 0;
            actualizarFoto(local);
        }

        function actualizarFoto(local) {
            cardImagen.src = local.fotos[currentPhotoIndex] || local.fotos[0];
            
            indicadoresFotos.innerHTML = '';
            local.fotos.forEach((_, idx) => {
                const barra = document.createElement('div');
                barra.classList.add('indicador-barra');
                if (idx === currentPhotoIndex) {
                    barra.classList.add('active');
                }
                indicadoresFotos.appendChild(barra);
            });
        }

        foodCard.addEventListener('click', () => {
            const local = localesComida[currentIndex];
            if (local.fotos.length > 1) {
                currentPhotoIndex = (currentPhotoIndex + 1) % local.fotos.length;
                actualizarFoto(local);
            }
        });

        const matchTitulo = document.getElementById('matchTitulo');
        const matchTexto = document.getElementById('matchTexto');
        const matchEmoji = document.getElementById('matchEmoji');

        function hacerSwipe(claseAnimacion, esSuperlike = false) {
            foodCard.classList.add(claseAnimacion);
            
            setTimeout(() => {
                if (claseAnimacion === 'swipe-right') {
                    if (esSuperlike) {
                        matchTitulo.textContent = "⭐ ¡SUPERLIKE! ⭐";
                        matchTexto.textContent = "¡Este plato te conquistó! Lo guardamos como uno de tus favoritos.";
                        matchEmoji.textContent = "🌟👑🍔✨";
                    } else {
                        matchTitulo.textContent = "¡Es un BiteMatch! 👑";
                        matchTexto.textContent = "A tu estómago y a este lugar les gusta lo mismo.";
                        matchEmoji.textContent = "🍔🔥🍕";
                    }
                    matchPopup.classList.add('show');
                } else {
                    siguienteTarjeta();
                }
            }, 300);
        }

        function siguienteTarjeta() {
            foodCard.classList.remove('swipe-left', 'swipe-right');
            currentIndex++;
            cargarLocal();
        }

        btnLike.addEventListener('click', () => hacerSwipe('swipe-right', false));
        btnSuperlike.addEventListener('click', () => hacerSwipe('swipe-right', true));
        btnDislike.addEventListener('click', () => hacerSwipe('swipe-left'));

        btnCerrarMatch.addEventListener('click', () => {
            matchPopup.classList.remove('show');
            siguienteTarjeta();
        });

        cargarLocal();
        }

        btnLike.addEventListener('click', () => hacerSwipe('swipe-right'));
        btnSuperlike.addEventListener('click', () => hacerSwipe('swipe-right'));
        btnDislike.addEventListener('click', () => hacerSwipe('swipe-left'));

        btnCerrarMatch.addEventListener('click', () => {
            matchPopup.classList.remove('show');
            siguienteTarjeta();
        });

        cargarLocal();
    </script>
</body>
</html>
